{% extends "base.html" %}

<!-- utilisateurs/templates/utilisateurs/connexion.html -->
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Connexion</title>
  </head>

  {% block content %}
  <section
    id="Section"
    style="
      width: 70%;
      height: 60%;
      margin: auto;

      text-align: center;
    "
  >
    <h2>LOGIN</h2>
    <form method="post">
      {% csrf_token %} {{ form.as_p }}
      <button
        type="submit"
        style="
          width: 100px;
          height: 30px;
          border-radius: 15px;
          font-size: 20px;
          cursor: pointer;
          border: 2px solid white;
          background-color: transparent;
          color: white;
          margin-top: 30px;
        "
      >
        Connect
      </button>
    </form>
    {% if messages %} {% for message in messages %}
    <p class="alert {{ message.tags }}">{{ message }}</p>
    {% endfor %} {% endif %} {% endblock content %}
  </section>
</html>
