{% extends "partials/base.html" %} {% load static %}

<DOCTYPE html>
  <html lang="fr">
    <head>
      <meta charset="UTF-8" />
      <title>ResetPassword</title>

      <link href="{% static 'css/ResetPass.css' %}" rel="stylesheet" />

      <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous"
      />

      <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      />
      <link rel="stylesheet" href="{% static 'css/styles.css' %}">







    </head>

    <body>
      {% block content %}



      <form method="POST" action="{% url 'reset_password' %}" class="container d-flex flex-column align-items-center p-4" style="max-width: 400px; background-color: #f1f1f1; border-radius: 10px; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);margin-top:50px">
        {% csrf_token %}
        
        <h3 class="mb-4" style="font-size: 24px; color: #333;">Reset Your Password</h3>
        
        <div class="form-outline mb-4 w-100">
            <label class="form-label" for="typeEmail" style="font-size: 16px; color: #555;">Enter You Email</label>
            <input type="email" id="typeEmail" name="email" class="form-control form-control-lg" placeholder="Your Email" required style="border-radius: 8px; padding: 12px;" />
        </div>
        
        <button type="submit" class="btn btn-primary btn-lg w-100" style="background-color: #007bff; border-radius: 8px; padding: 12px; font-size: 18px; transition: background-color 0.3s;">
            Reset Password 
        </button>
        
        <div class="text-center mt-3">
            <a href="{% url 'Login' %}" class="text-decoration-none" style="color: #007bff; font-size: 14px; transition: color 0.3s;">Back To Login</a>
        </div>
    </form>
    


{% endblock %}

      <script>
        src = "{% static 'https://kit.fontawesome.com/3d9ffd68dd.js' %}";
        crossorigin = "anonymous";
      </script>

      <script
        src="{% static 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js' %}"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
      ></script>

      <script src="{% static 'js/script.js' %}"></script>
    </body></html
></DOCTYPE>
