{% load static %}

<DOCTYPE html>
    <html lang="fr">
        <head>
            <meta charset="UTF-8" />
            <title>Dashboard</title>
      
            <link href="{% static 'css/Dashboard.css' %}" rel="stylesheet" />
           
            <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
         
            <link rel="stylesheet" href="{% static 'css/styles.css' %}">
          </head>
    
    


    <body>

        {% block content %}

        <section id="ProjectDetails">

            <h3 id="DashboardTitle" style="width:52%">
                Project Status Dashboard
            </h3>
            <div id="DashboardLogo">

                <i id="icon" class="fas fa-cubes fa-2x me-3" style="color: #B91116;" ></i>
                <span class="h1 fw-bold mb-0" style="color: white;">ChronoPlan</span>
            </div>
            <div id="DashboardText">

                <h3 id="DashboardTitle2">
                   
                    

                    <iframe name="date du jour" id="date-du-jour" style="width:150px;height:250px; font-family: cursive;" src="https://www.mathieuweb.fr/calendrier/date-jour-bleu.html" scrolling="no" frameborder="0" allowtransparency="true"></iframe>
                    
                    
                </h3>
            </div>

            <div id="WelcomeLogo" style="width:400px;cursor:pointer;" onclick="window.location.href='{% url 'main' %}'" >
                <i id="iconWelcome" class="fa-solid fa-reply" style="color: white;"></i>
                <h1 id="WelcomeText" style="color:white;font-weight: bold;padding-left: 5px;text-success:white"class="text-success">Bach To Main |</h1>

            </div>

            <div id="WelcomeLogo" style="width:500px">
                <i id="iconWelcome" class="fa-regular fa-hand" style="color: white;"></i>
                <h1 id="WelcomeText" style="color: white;font-weight: bold;padding-left: 5px;"class="text-success">Welcome, {{user.username}} |</h1>

            </div>
            
            
            <div id="LogIn" id="ProjectData2" onclick="window.location.href='{% url 'logout' %}'" style="cursor: pointer;width:200px;display:flex;justify-content:space-between;margin-top:15px">
                <i id="iconLogout" style="color: white;padding-top: 2px;" class="fa-solid fa-right-to-bracket"></i>
                <h1 id="Text" style="color: red; width: 90px;height: 50px;font-size: 20px;font-family: cursive;padding-left: 5px;font-weight: bold;" >Log Out</h1>


            





            <div></div>


 
        </section>

        <section id="ProjectData">

            <div id="ProjectData1">
                <img src="images/gest.jpg" alt="" id="ProjectDataImg1">
                <h3 style="color: white;">Time Vs Project Phase</h3>
                
            </div>
           

                <div id="ProjectData2" onclick="window.location.href='{% url 'display_value' %}'" style="cursor: pointer;">

                    
                
                    <img src="images/gest.jpg" alt="" id="ProjectDataImg1">
                    <h3 style="color: white;"> Phase % Completed</h3>
                </div>


         
            
            <div id="ProjectData3">
                <img src="images/gest.jpg" alt="" id="ProjectDataImg1">
                <h3 style="color: white;">Project Cost Performance</h3>
            </div>
            <div id="ProjectData4">
                <img src="images/gest.jpg" alt="" id="ProjectDataImg1">
                <h3 style="color: white;">Timeline Project</h3>
            </div>

            


            
        </section>

        <section id="ProjectTimeline">
            <div id="ProductivityReport">
                <img src="images/gest.jpg" alt="" id="ProjectDataImg1">
                <h3 style="color: white;">Productivity Report</h3>
            </div>
            <div id="ProductivityReport">
                <img src="images/gest.jpg" alt="" id="ProjectDataImg1">
                <h3 style="color: white;">Productivity Report</h3>
            </div>


            
        </section>


        {% endblock %}

        <script>
        src="{% static 'https://kit.fontawesome.com/3d9ffd68dd.js' %}" 
        crossorigin="anonymous"
        </script>
  
        <script
          src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"
        ></script>
        <script
          src="https://kit.fontawesome.com/3d9ffd68dd.js"
          crossorigin="anonymous"
        ></script>
        <script src="{% static 'js/script.js' %}"></script>





    </body>
    
    
    </html>
