<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
  </head>
  <body>
    
    
    <form method="post">
      {% csrf_token %} {{ form.as_p }}
      <button type="submit">Se connecter</button>
    </form>
    {% if messages %} {% for message in messages %}
    <p>{{ message }}</p>
    {% endfor %} {% endif %}
  </body>
</html>
