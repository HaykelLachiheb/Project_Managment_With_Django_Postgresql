{% load static %}

<DOCTYPE html>
  <html lang="fr">
    <head>
      <meta charset="UTF-8" />
      <title>Main</title>

      <link href="{% static 'css/Main.css' %}" rel="stylesheet" />

      <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous"
      />

      <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      />
      <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    </head>

    <body>
      {% block content %}

      <section id="SectionLeft">
        <div id="WelcomeLogo">
          <i
            id="iconWelcome"
            class="fa-regular fa-hand"
            style="color: rgb(125, 135, 194)"
          ></i>
          <h1 style="color: rgb(125, 135, 194)" class="text-success">
            Welcome, {{user.username}}
          </h1>
        </div>

        <div
          id="WelcomeLogo"
          style="cursor: pointer"
          onclick="window.location.href='{% url 'logout' %}'"
        >
          <i
            id="iconLogout"
            style="color: rgb(125, 135, 194)"
            class="fa-solid fa-right-to-bracket"
          ></i>
          <h1 style="color: rgb(125, 135, 194)">Log Out</h1>
        </div>

        <h3 id="DashboardTitle2">
          <iframe
            name="date du jour"
            id="date-du-jour"
            style="
              width: 97px;
              height: 64px;
              font-family: cursive;
              float: left;
              margin-right: 230px;
              background-color: #2f3443;
              box-shadow: 0 0 20px 0 rgba(2, 2, 36, 0.2);
            "
            src="https://www.mathieuweb.fr/calendrier/date-jour-bleu.html"
            scrolling="no"
            frameborder="0"
            allowtransparency="true"
          ></iframe>
        </h3>
      </section>

      <section id="SectionRight" style="height: 95%">
        <div id="LogoDiv">
          <i
            id="icon"
            class="fas fa-cubes fa-2x me-3"
            style="color: #b91116"
          ></i>
          <span
            class="h1 fw-bold mb-0"
            style="color: #0f466d; margin-right: 30%"
            >ChronoPlan</span
          >
        </div>

        <div id="Div1">
          <div
            onclick="window.location.href='{% url 'dashboard' %}'"
            style="cursor: pointer; background: rgb(236, 220, 220)"
            id="Div1-Part1"
            onmouseenter="myFunctionUp()"
            onmouseout="myFunctionDown()"
          >
            <h3 id="Div1-Part1-Header" style="margin-left: 33%">Dashboard</h3>
          </div>
          <div
            onclick="window.location.href='{% url 'taskManagment' %}'"
            style="cursor: pointer"
            id="Div1-Part2"
            onmouseenter="myFunctionUp2()"
            onmouseout="myFunctionDown2()"
          >
            <h3 style="margin-left: 20%">Tasks Managment</h3>
          </div>
          <div
            onclick="window.location.href='{% url 'EmployeesManagment' %}'"
            id="Div1-Part3"
            style="cursor: pointer; background: rgb(236, 220, 220)"
            onmouseenter="myFunctionUp3()"
            onmouseout="myFunctionDown3()"
          >
            <h3 style="margin-left: 12%">Employees Managment</h3>
          </div>
        </div>
        <div id="Div2">
          <div
            onclick="window.location.href='{% url 'display_tasks' %}'"
            style="cursor: pointer"
            id="Div2-Part1"
            onmouseenter="myFunctionUp4()"
            onmouseout="myFunctionDown4()"
          >
            <h3>Roadmap</h3>
          </div>
          <div
            onclick="window.location.href='{% url 'DisplaySearch' %}'"
            style="cursor: pointer; background: rgb(236, 220, 220)"
            id="Div2-Part2"
            onmouseenter="myFunctionUp5()"
            onmouseout="myFunctionDown5()"
          >
            <h3 style="width: 100%; margin-left: 20%">Display & Search</h3>
          </div>
          <div
            id="Div2-Part3"
            onclick="window.location.href='{% url 'todolist' %}'"
            style="cursor: pointer"
            onmouseenter="myFunctionUp6()"
            onmouseout="myFunctionDown6()"
          >
            <h3 style="margin-left: 14%">Employee To Do List</h3>
          </div>
        </div>
      </section>

      {% endblock %}

      <script>
        src = "{% static 'https://kit.fontawesome.com/3d9ffd68dd.js' %}";
        crossorigin = "anonymous";
      </script>

      <script
        src="{% static 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js' %}"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
      ></script>

      <script src="{% static 'js/script.js' %}"></script>
    </body>
  </html>
</DOCTYPE>
