{% extends "partials/base.html" %} {% load static %}

<DOCTYPE html>
  <html lang="fr">
    <head>
      <meta charset="UTF-8" />
      <title>ResetPassword</title>

      <link href="{% static 'css/ResetPass.css' %}" rel="stylesheet" />

      <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous"
      />

      <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      />
      <link rel="stylesheet" href="{% static 'css/styles.css' %}">







    </head>

    <body>
      {% block content %}
      <div id="card" class="card text-center" style="width: 300px;height:444px;margin:auto;margin-top:70px">
        <div class="card-header h5 text-white bg-primary">Password Reset</div>
        <div class="card-body px-5">
         
          <i class="material-icons" style="color: #ff6219">lock_reset</i>

          <p class="card-text py-2">
            Enter your email address and we'll send you an email with
            instructions to reset your password.
          </p>
          <div data-mdb-input-init class="form-outline">
            <label class="form-label" for="typeEmail"
              >PLease Enter your email</label
            >
            <input type="email" id="typeEmail" class="form-control my-3" />
          </div>
          <a href="#" data-mdb-ripple-init class="btn btn-primary w-100"
            >Reset password</a
          >
          <div class="d-flex justify-content-between mt-4">
            <a
              class=""
              onclick=" href='http://127.0.0.1:8000/index'"
              style="cursor: pointer"
              >Login</a
            >
            <a class="" href="http://127.0.0.1:8000/signup">Register</a>
          </div>
        </div>
      </div>

      {% endblock %}

      <script>
        src = "{% static 'https://kit.fontawesome.com/3d9ffd68dd.js' %}";
        crossorigin = "anonymous";
      </script>

      <script
        src="{% static 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js' %}"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
      ></script>

      <script src="{% static 'js/script.js' %}"></script>
    </body></html
></DOCTYPE>
