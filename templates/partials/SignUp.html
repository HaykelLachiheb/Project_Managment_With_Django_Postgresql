{% extends "partials/base.html" %} {% load static %}

<DOCTYPE html>
  <html lang="fr">
    <head>
      <meta charset="UTF-8" />
      <title>Sign Up</title>

      <link href="{% static 'css/SignUpStyle.css' %}" rel="stylesheet" />

      <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous"
      />

      <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      />
    </head>

    <body>
      {% block content %}
      <section id="Box" style="width: 50%; margin: auto; margin-top: 80px;">
        <div class="card text-center" style="margin-top:-25px;border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
          <div class="card-header" style="font-family: Avantgarde, sans-serif; background: #2196F3; color: white; border-radius: 10px 10px 0 0; padding: 15px;">
            <h3>Sign Up</h3>
          </div>
    
          <form method="post" style="display: flex; flex-direction: column; gap: 20px; padding: 20px; background: #f4f4f9; border-radius: 0 0 10px 10px;">
            {% csrf_token %}
    
            <!-- Name Field -->
            <label for="your_name" style="font-family: Avantgarde, sans-serif; font-size: 14px; color: #333;">
              Name
            </label>
            <input
              id="your_name"
              type="text"
              name="your_name"
              value="{{ current_name }}"
              placeholder="Enter your full name"
              style="padding: 10px; font-size: 14px; border-radius: 5px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; margin-bottom: 15px;"
            />
    
            <!-- Username Field -->
            <label for="username" style="font-family: Avantgarde, sans-serif; font-size: 14px; color: #333;">
              Username
            </label>
            <input
              id="username"
              type="text"
              name="username"
              value="{{ current_username }}"
              placeholder="Choose a username"
              style="padding: 10px; font-size: 14px; border-radius: 5px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; margin-bottom: 15px;"
            />
    
            <!-- Password Field -->
            <label for="password" style="font-family: Avantgarde, sans-serif; font-size: 14px; color: #333;">
              Password
            </label>
            <input
              id="password"
              type="password"
              name="password"
              placeholder="Enter your password"
              style="padding: 10px; font-size: 14px; border-radius: 5px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; margin-bottom: 25px;"
            />
    
            <!-- Buttons Section -->
            <div style="display: flex; justify-content: space-between; gap: 10px;">
              <a href="{% url 'login' %}" style="flex: 1; text-align: center;">
                <button
                  type="button"
                  style="padding: 10px; font-size: 16px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%;"
                >
                  Validate
                </button>
              </a>
    
              <input
                type="submit"
                value="Delete"
                style="padding: 10px; font-size: 16px; background: #f44336; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%;"
              />
            </div>
          </form>
        </div>
      </section>
    {% endblock %}
    

      <script>
        src = "{% static 'https://kit.fontawesome.com/3d9ffd68dd.js' %}";
        crossorigin = "anonymous";
      </script>

      <script
        src="{% static 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js' %}"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
      ></script>

      <script src="{% static 'js/script.js' %}"></script>
    </body></html
></DOCTYPE>
