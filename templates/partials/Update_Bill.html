{% extends 'partials/base.html' %}
{% load static %}
<head>

    {% block stylesheets %}
<link rel="stylesheet" href="{% static 'css/styles.css' %}">

<link href="{% static 'css/material-dashboard.css' %}" rel="stylesheet" />
  <link href="{% static 'css/material-dashboard.css.map' %}" rel="stylesheet" />
  <link href="{% static 'css/material-dashboard.min.css' %}" rel="stylesheet" />
  <link href="{% static 'css/material-dashboard-rtl.css' %}" rel="stylesheet" />
  <link href="{% static 'css/style.css' %}" rel="stylesheet" />


 <!-- Bootstrap CSS -->
 <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" />
 <link href="{% static 'css/bootstrap.css' %}" rel="stylesheet" />
 <link href="{% static 'css/bootstrap.css.map' %}" rel="stylesheet" />
 <link href="{% static 'css/bootstrap.min.css.map' %}" rel="stylesheet" />  
 <link href="{% static 'css/bootstrap-grid.css' %}" rel="stylesheet" /> 
 <link href="{% static 'css/bootstrap-grid.css.map' %}" rel="stylesheet" /> 
 <link href="{% static 'css/bootstrap-grid.min.css' %}" rel="stylesheet" />  
 <link href="{% static 'css/bootstrap-grid.min.css.map' %}" rel="stylesheet" /> 
 <link href="{% static 'css/bootstrap-reboot.css' %}" rel="stylesheet" /> 
 <link href="{% static 'css/bootstrap-reboot.css.map' %}" rel="stylesheet" /> 
 <link href="{% static 'css/bootstrap-reboot.min.css' %}" rel="stylesheet" /> 
 <link href="{% static 'css/bootstrap-reboot.min.css.map' %}" rel="stylesheet" /> 
 <link href="{% static 'css/demo.css' %}" rel="stylesheet" /> 


<style>

    body {
        font-family: 'Avantgarde';
        background-color: #f4f4f9;
        margin: 0;
        padding: 0;
    }

    h1 {
        text-align: center;
        padding: 20px;
        color: #333;
    }

    table {
        width: 850px;
        margin: 20px auto;
        border-collapse: collapse;
        background-color: #fff;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    thead {
        background-color: #007BFF;
        color: white;
    }

    th, td {
        padding: 12px 20px;
        text-align: center;
    }

    tr:nth-child(even) {
        background-color: #f2f2f2;
    }

    th {
        font-weight: bold;
    }

    td button {
        padding: 8px 12px;
        margin: 5px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        transition: background-color 0.3s ease;
    }

    td button:hover {
        opacity: 0.8;
    }

    .fetch-bills {
        background-color: #28a745;
        color: white;
    }

    .add-bill {
        background-color: #007bff;
        color: white;
    }

    .update-bill {
        background-color: #ffc107;
        color: white;
    }

    .delete-bill {
        background-color: #dc3545;
        color: white;
    }

    .search-bill {
        background-color: #17a2b8;
        color: white;
    }

    .payment-bill {
        background-color: #6610f2;
        color: white;
    }

    .container-fluid div{
        margin-top:0px;
    }



</style>    




{% endblock stylesheets %}


{% block content %}

<div class="container my-5">
    <div class="card shadow">
      <div class="card-header bg-primary text-white text-center">
        <h3>Update Invoice</h3>
      </div>
      <div class="card-body">
        <form action="/update_invoice/" method="POST" enctype="multipart/form-data">
          {% csrf_token %}
          <!-- Champ Bill_ID -->
          <div class="mb-3">
            <label for="Bill_ID" class="form-label">Invoice ID</label>
            <input
              type="text"
              class="form-control"
              id="Bill_ID"
              name="Bill_ID"
              placeholder="Enter the Invoice ID"
              required
            />
          </div>
  
          <!-- Champ Montant -->
          <div class="mb-3">
            <label for="Amount" class="form-label">Amount</label>
            <input
              type="number"
              class="form-control"
              id="Amount"
              name="Amount"
              placeholder="Enter the Amount"
              required
            />
          </div>
  
          <!-- Champ Date d'échéance -->
          <div class="mb-3">
            <label for="Due_Date" class="form-label">Due Date</label>
            <input
              type="date"
              class="form-control"
              id="Due_Date"
              name="Due_Date"
              required
            />
          </div>
  
          <!-- Champ Fichier PDF -->
          <div class="mb-3">
            <label for="PDF_File" class="form-label">Upload PDF</label>
            <input
              type="file"
              class="form-control"
              id="PDF_File"
              name="pdf_file"
              accept="application/pdf"
            />
          </div>
  
          <!-- Bouton de soumission -->
          <div class="text-center">
            <button type="submit" class="btn btn-success btn-lg">
              Submit
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
   
  

{% endblock %}
