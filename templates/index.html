{% load static %}

<DOCTYPE html>
  <html lang="fr">
    <head>
      <meta charset="UTF-8" />
      <title>Login</title>

      <link href="{% static 'css/style.css' %}" rel="stylesheet" />

      <link
        href="{% static 'https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css' %}"
        rel="stylesheet"
      />

      <link
        rel="{% static 'stylesheet"
        href="path/to/font-awesome/css/font-awesome.min.css' %}"
      />
      <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    </head>

    <body>
      <section
        id="vh-70"
        style="background-color: #bec0db; width: 100%; height: 100%"
      >
        <div class="container py-5 h-100" style="padding-top: 100px">
          <div
            class="row d-flex justify-content-center align-items-center h-100"
          >
            <div class="col col-xl-10">
              <div
                class="card"
                style="
                  border-radius: 5rem;
                  background-image: url('{% static 'images/Form_BackGround.jpg' %}');
                  height: 70%;
                  color: white;
                  width: 70%;
                  margin: auto;
                "
              >
                <div class="row g-0">
                  <div
                    id="IconBox"
                    style="
                      width: 30%;
                      height: 100px;
                      margin: auto;
                      display: flex;
                      justify-content: space-between;
                    "
                  >
                    <i
                      class="fas fa-cubes fa-2x me-3"
                      style="color: #b91116; margin-top: 60px"
                    ></i>

                    <h3
                      style="
                        color: white;
                        font-size: 50px;
                        font-family: cursive;
                      "
                    >
                      ChronoPlan
                    </h3>
                  </div>

                  <div
                    class="col-md-6 col-lg-5 d-none d-md-block"
                    id="Panel"
                    style="padding-top: 50px"
                  >
                    {% block content %} {% endblock content %}
                  </div>
                  <div class="col-md-6 col-lg-7 d-flex align-items-center">
                    <div
                      class="card-body p-4 p-lg-5 text-white"
                      style="color: white; width: 100%"
                    ></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <script>
        src = "{% static 'https://kit.fontawesome.com/3d9ffd68dd.js' %}";
        crossorigin = "anonymous";
      </script>

      <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
      ></script>
      <script
        src="https://kit.fontawesome.com/3d9ffd68dd.js"
        crossorigin="anonymous"
      ></script>

      <script src="{% static 'js/script.js' %}"></script>
    </body></html
></DOCTYPE>
